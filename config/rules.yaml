# Trading rules. One source of truth: the scripts and the scheduled checks read this file.
# Spot only. Nothing here places orders.

account:
  exchange: Kraken
  pot_gbp: 5000            # confirmed 2026-11-23
  max_position_pct: 20     # at most 1/5 of the pot in one trade
  risk_per_trade_pct: 2    # size each trade so hitting the stop loses at most 2% of the pot
  max_open_positions: 5

costs:                      # Kraken Pro lowest volume tier (check your own tier in Kraken)
  taker_fee_pct: 0.40       # paid on each buy and each sell with market orders
  maker_fee_pct: 0.25       # limit orders that rest on the book
  slippage_pct: 0.05        # extra allowance per side in backtests

regime:
  # Master switch: no new trend buys unless BTC's last daily close (00:00 UTC) is above this average.
  btc_trend_sma_days: 200

stops:
  # Exit if price falls this far below the highest daily close since entry.
  # Was 10%. Backtest 2018-2026 (scripts/backtest.py): 10% is too tight for BTC (+83% vs +430%
  # with no stop: it churns on normal swings). Results jump around between 10/15/20/25/30%, so no
  # value is "optimal"; 20% is a middle choice that kept ETH/BTC drawdowns well below buy-and-hold.
  trailing_stop_pct: 20

macro:
  wait_hours_before_high_impact: 48   # high-impact US release (CPI, PCE, GDP, payrolls, FOMC) => WAIT

liquidity:
  max_spread_pct: 0.20      # Kraken bid/ask spread must be below this

filters:
  # Tested by scripts/research_filters.py (design 2018-2022, hold-out 2023-2026, fees included).
  # Adopted: wait for a 2nd consecutive daily close above the 200-day average before buying.
  #   Hold-out expectancy per trade: BTC 6.6% -> 8.0%, SOL 7.1% -> 7.7%; ETH slightly worse
  #   (14.2% -> 12.3%). Design period better on all three. Cuts 1-day whipsaw buys. Small edge.
  confirm_closes_above_sma: 2
  # Tested and REJECTED (no hold-out improvement on top of the trend rule):
  #   3-close confirmation, close >2% above SMA, weekly 20w/50w trend, relative strength vs BTC,
  #   volatility filter, Fear & Greed < 75 / < 60, MVRV < 3.0 / < 2.5, stablecoin supply growth,
  #   funding not in top 10%. Weekly > 20w looked great in 2018-2022 (BTC +374% vs +137%) but failed
  #   2023-2026: a textbook overfit. These are shown on the board as context only.

signals:
  # Rule A (trend): coin closes above its own 200-day average AND BTC passes the regime rule.
  #   Exit: trailing stop, or a daily close back below the 200-day average.
  # Rule B (staged buying): BTC below its 200-day average and 14-day RSI below 30.
  #   Buy 1/3 per stage, later stages only after a further 7% drop. Exit at the 200-day average,
  #   or if price closes 25% below the average entry.
  # Whether each rule is ENABLED is set from the backtest results (see README / backtest output).
  rule_a_trend:
    enabled: true
    # Backtest 2018-2026, fees included: beat buy-and-hold on return/drawdown for BTC, ETH, SOL.
    tested_ok: [BTC, ETH, SOL]
    # Not enough history to judge (Kraken gives ~1 year after the 200-day warm-up): half size only.
    untested_half_size: [HYPE, XMR]
    # Lost money or lagged badly with this rule: do not trade with it.
    failed: [LINK, TRX, TAO]
  rule_b_staged:
    enabled: false          # Backtest: BTC -20% vs +432% buy-and-hold; SOL -57%; ETH +23% vs +99%. Rejected.
    rsi_days: 14
    rsi_below: 30
    stages: 3
    next_stage_drop_pct: 7
    stop_below_avg_entry_pct: 25
